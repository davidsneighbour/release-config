name: Publish package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] no `cache` input is set, so setup-node does not cache dependencies here
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"

          if [[ "${tag}" != "${version}" ]]; then
            echo "Tag/version mismatch:"
            echo "  pushed tag:       ${tag}"
            echo "  package version:  ${version}"
            exit 1
          fi

      - name: Publish package
        run: npm publish
